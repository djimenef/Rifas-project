<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DaleChance · Iniciar sesión</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <style>
    /* Estilos propios de la página de inicio de sesión (todo sale de los tokens) */
    main { padding: var(--sp-56) 0; }
    .login { max-width: 440px; margin: 0 auto; }
    .login h1 { font-size: var(--fs-h2); letter-spacing: var(--ls-tight); margin: 0 0 var(--sp-8); }
    .login > p { color: var(--muted); margin: 0 0 var(--sp-24); }
    .card { display: grid; gap: var(--sp-18); }
    form { display: grid; gap: var(--sp-14); }
    input[type="text"], input[type="password"] { width: 100%; }
    .pass { position: relative; }
    .pass input { padding-right: 76px; }
    .pass button {
      position: absolute; right: var(--sp-8); top: 50%; transform: translateY(-50%);
      border: 0; background: none; color: var(--muted); font: inherit; font-size: var(--fs-label); font-weight: var(--fw-semibold); cursor: pointer; padding: var(--sp-6) var(--sp-8);
    }
    .row { display: flex; justify-content: space-between; align-items: center; gap: var(--sp-12); flex-wrap: wrap; font-size: var(--fs-small); }
    .check { display: flex; gap: var(--sp-8); align-items: center; font-weight: var(--fw-regular); color: var(--muted); }
    .row a { color: var(--accent); font-weight: var(--fw-semibold); text-decoration: none; }
    .msg { display: none; font-weight: var(--fw-semibold); text-align: center; margin: 0; }
    .msg.ok { display: block; color: var(--ok); }
    .msg.error { display: block; color: var(--error); }

    /* Separador y Google */
    .or { display: flex; align-items: center; gap: var(--sp-12); color: var(--muted); font-size: var(--fs-label); }
    .or::before, .or::after { content: ""; flex: 1; border-top: 1px solid var(--border); }
    .google {
      display: flex; align-items: center; justify-content: center; gap: var(--sp-10); width: 100%;
      padding: var(--sp-11) var(--sp-22); border-radius: var(--radius-pill); border: 1px solid var(--google-border);
      background: var(--google-bg); color: var(--google-ink); font: inherit; font-weight: var(--fw-medium); cursor: pointer;
      transition: background .15s, box-shadow .15s;
    }
    .google:hover { background: var(--google-bg-hover); box-shadow: var(--google-shadow-hover); }
    .google svg { width: var(--sp-18); height: var(--sp-18); flex: none; }
    #google-official { display: flex; justify-content: center; min-height: var(--size-control); }
    #google-official:empty { display: none; }

    @media (max-width: 520px) {
      .card { padding: var(--sp-22); }
    }
  </style>
</head>
<body>

<header data-layout="header" data-variante="volver"></header>

<main>
  <div class="wrap login">
    <h1>Inicia sesión</h1>
    <p>Revisa tus cupones y participa en los sorteos.</p>
    <div class="card">
      <!-- Botón oficial de Google (se muestra cuando hay un Client ID configurado) -->
      <div id="google-official"></div>
      <button type="button" class="google" id="google-btn">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        Continuar con Google
      </button>

      <div class="or">o con tu cuenta</div>

      <form id="form" novalidate>
        <label>Correo electrónico o DNI<input type="text" id="user" autocomplete="username" required placeholder="tucorreo@ejemplo.com"></label>
        <label>Contraseña
          <span class="pass">
            <input type="password" id="password" autocomplete="current-password" required minlength="6" placeholder="••••••••">
            <button type="button" id="toggle-pass" aria-label="Mostrar contraseña">Mostrar</button>
          </span>
        </label>
        <div class="row">
          <label class="check"><input type="checkbox"> Recordarme</label>
          <a href="#">¿Olvidaste tu contraseña?</a>
        </div>
        <button class="btn btn-primary" type="submit">Iniciar sesión</button>
      </form>
      <p class="msg" id="msg" role="status"></p>
    </div>
    <p class="alt">¿No tienes cuenta? <a href="crear-cuenta.html">Crear cuenta</a></p>
  </div>
</main>

<footer data-layout="footer"></footer>

<script>
  // Pega aquí el Client ID de Google Cloud (OAuth 2.0, tipo "Aplicación web") para activar el inicio de sesión real con Google.
  const GOOGLE_CLIENT_ID = '';

  const msg = document.getElementById('msg');
  function show(text, type) {
    msg.textContent = text;
    msg.className = 'msg ' + type;
  }

  // Formulario (demo: aún no hay servidor que valide las credenciales)
  const form = document.getElementById('form');
  const user = document.getElementById('user');
  const password = document.getElementById('password');
  form.addEventListener('submit', e => {
    e.preventDefault();
    const u = user.value.trim();
    const isEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(u);
    const isDni = /^[0-9]{8}$/.test(u);
    if (!isEmail && !isDni) return show('Ingresa un correo válido o un DNI de 8 dígitos.', 'error');
    if (password.value.length < 6) return show('La contraseña debe tener al menos 6 caracteres.', 'error');
    show('¡Bienvenido de nuevo! Sesión iniciada (demo).', 'ok');
    form.reset();
  });

  const togglePass = document.getElementById('toggle-pass');
  togglePass.addEventListener('click', () => {
    const hidden = password.type === 'password';
    password.type = hidden ? 'text' : 'password';
    togglePass.textContent = hidden ? 'Ocultar' : 'Mostrar';
    togglePass.setAttribute('aria-label', hidden ? 'Ocultar contraseña' : 'Mostrar contraseña');
  });

  // Inicio de sesión con Google (Google Identity Services)
  const googleBtn = document.getElementById('google-btn');

  function onGoogleCredential(response) {
    // OJO: en producción este token (JWT) se envía al servidor para verificarlo; aquí solo se lee para la demo.
    const payload = JSON.parse(decodeURIComponent(escape(atob(response.credential.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')))));
    show(`¡Hola, ${payload.given_name || payload.name}! Iniciaste sesión con Google.`, 'ok');
  }

  if (GOOGLE_CLIENT_ID) {
    const s = document.createElement('script');
    s.src = 'https://accounts.google.com/gsi/client';
    s.async = true;
    s.onload = () => {
      google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: onGoogleCredential });
      google.accounts.id.renderButton(document.getElementById('google-official'), {
        theme: 'outline', size: 'large', shape: 'pill', text: 'continue_with', locale: 'es', width: 320
      });
      googleBtn.hidden = true;
    };
    document.head.appendChild(s);
  } else {
    googleBtn.addEventListener('click', () =>
      show('El inicio con Google aún no está configurado (falta el Client ID).', 'error'));
  }
</script>
<script type="module" src="assets/js/layout.js"></script>
</body>
</html>
