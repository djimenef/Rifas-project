<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DaleChance · Iniciar sesión</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/paginas/iniciar-sesion.css">
</head>
<body>

<header data-layout="header" data-variante="volver"></header>

<main>
  <div class="wrap login">
    <h1>Inicia sesión</h1>
    <p>Revisa tus cupones y participa en los sorteos.</p>
    <div class="card">
      <!-- Botón oficial de Google (se muestra cuando hay un Client ID configurado) -->
      <div id="google-official"></div>
      <button type="button" class="google" id="google-btn">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        Continuar con Google
      </button>

      <div class="or">o con tu cuenta</div>

      <form id="form" novalidate>
        <label>Correo electrónico o DNI<input type="text" id="user" autocomplete="username" required placeholder="tucorreo@ejemplo.com"></label>
        <label>Contraseña
          <span class="pass">
            <input type="password" id="password" autocomplete="current-password" required minlength="6" placeholder="••••••••">
            <button type="button" id="toggle-pass" aria-label="Mostrar contraseña">Mostrar</button>
          </span>
        </label>
        <div class="row">
          <label class="check"><input type="checkbox"> Recordarme</label>
          <a href="#">¿Olvidaste tu contraseña?</a>
        </div>
        <button class="btn btn-primary" type="submit">Iniciar sesión</button>
      </form>
      <p class="msg" id="msg" role="status"></p>
    </div>
    <p class="alt">¿No tienes cuenta? <a href="crear-cuenta.html">Crear cuenta</a></p>
  </div>
</main>

<footer data-layout="footer"></footer>

<script type="module" src="assets/js/paginas/iniciar-sesion.js"></script>
</body>
</html>
