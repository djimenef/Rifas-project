<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DaleChance · Rifas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/paginas/rifas.css">
</head>
<body data-ruta="rifas">

<header data-layout="header"></header>

<main>
  <div class="wrap pagina">
    <h1 class="pagina-titulo">Rifas</h1>
    <p class="pagina-sub">Pon tus Chances en la rifa que quieras. Mientras se arma, tus Chances quedan retenidas y solo se usan si la rifa se arma.</p>

    <form class="filtros" id="filtros" role="search" aria-label="Buscar y filtrar rifas">
      <label>Buscar<input type="search" name="q" id="busqueda" placeholder="Ej.: PlayStation, zapatillas…" autocomplete="off"></label>
      <label>Estado<select name="estado" id="filtro-estado"><option value="">Todos los estados</option></select></label>
      <label>Categoría<select name="categoria" id="filtro-categoria"><option value="">Todas las categorías</option></select></label>
    </form>

    <p class="filtros-total" id="total" role="status" aria-live="polite"></p>
    <div id="listado"></div>
  </div>
</main>

<footer data-layout="footer"></footer>

<script type="module" src="../assets/js/paginas/rifas.js"></script>
</body>
</html>
